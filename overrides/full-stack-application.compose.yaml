# overrides/full-stack-application.compose.yaml
#
# golden-build.full-stack-application.sh copies this into HOLO_SRC as
# compose.full-stack-application.yaml (HOLO_COMPOSE_FILE).
#
# FULLY SELF-CONTAINED as of the 2026-09-22 repo split (test_backend +
# test_frontend) — there is no single-repo compose.yaml to merge with
# anymore (each split repo has its OWN standalone compose.yaml for
# independent dev, unrelated to this one). Same shape as control-tower's own
# override: this file IS the whole composite, not a patch on top of
# something else. golden-build's dc() only ever needs
# -f compose.full-stack-application.yaml -f <pgdata override> — no third
# file, no merge step.
#
# Three jobs:
#   1. db: plain Postgres, same as either split repo's own compose.yaml.
#   2. backend: installs the omnigent/claude CLIs at container start (same
#      recipe as control-tower's devbox/compliance-ui's cpl-webserver), runs
#      as root (no --user/PATH gymnastics needed for the omnigent pip
#      install — only the claude/node install needs $HOME/.local/bin on
#      PATH), and adds --reload to uvicorn + bind-mounts source so an
#      agent's backend edits take effect without a rebuild. Builds from
#      ./test_backend now (was ./backend pre-split).
#   3. frontend: swapped from the production nginx static build to Vite's
#      own dev server (`npm run dev`) so UI edits hot-reload in a struck
#      workspace's preview. Builds from ./test_frontend now (was ./frontend
#      pre-split). `target: build` re-runs the Dockerfile's `npm run build`
#      step even though we discard its output — a small, accepted
#      inefficiency rather than restructuring the repo's own Dockerfile.
#
# Image names pinned in the paired full-stack-application.pgdata.yaml
# override, not here — same file-split convention control-tower uses.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-project_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_tracker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./test_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://project_tracker:project_tracker@db:5432/project_tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000}
      # Container-level PATH, not a shell-local `export` — the command
      # below's `export PATH=...` only reaches ITS OWN process tree, never
      # any LATER, SEPARATE `docker exec` session into this same container.
      # That includes the one that matters most: `omnigent host` itself is
      # started via its own independent exec call from the control plane,
      # so it never saw the entrypoint's export either — confirmed for real
      # 2026-09-23: agy was genuinely installed at /root/.local/bin/agy
      # (its own installer confirmed this), yet Omnigent reported
      # "harness antigravity-native is not configured on host", because
      # omnigent host's own PATH-based capability check never had
      # /root/.local/bin on it. Same root cause behind the earlier Codex
      # "not on PATH" failure. Prepended to the container's REAL default
      # (checked directly: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin)
      # rather than guessed, so python/pip/alembic/uvicorn aren't at risk.
      PATH: /root/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      db:
        condition: service_healthy
    # --pre (below, on the omnigent install) is required: omnigent==0.8.2
    # transitively needs opentelemetry-instrumentation-fastapi>=0,<1, and
    # every published version of that package is still a beta prerelease
    # (0.65b0, etc. — no stable release exists yet). Plain pip refuses
    # prereleases unless told to; control-tower's devbox doesn't hit this
    # because it uses `uv pip install`, which resolves it differently.
    #
    # curl is also installed explicitly below — python:3.12-slim doesn't
    # ship it (unlike whatever base control-tower's devbox/compliance-ui's
    # cpl-webserver use), so the claude/node download would silently pipe
    # nothing into tar and crash the container ("curl: not found" -> "gzip:
    # unexpected end of file" -> tar exit 1). Guarded by `command -v curl`
    # so it only runs apt-get once per container lifetime, not every start.
    #
    # The Node.js download picks its tarball's architecture from `uname -m`
    # at runtime instead of a hardcoded linux-x64 URL (what control-tower's
    # devbox uses verbatim) — confirmed for real on Apple Silicon: a
    # hardcoded x64 binary inside a natively-arm64 container produced a
    # Rosetta ELF-loader crash. Picking the matching arch avoids needing
    # Rosetta to translate this one binary at all. Not strictly needed on a
    # standard (x86_64) GCE VM, since the hardcoded URL would already match
    # there — kept anyway since it's strictly more correct with no downside
    # (also future-proofs against an ARM-based GCE instance, e.g. Tau T2A).
    #
    # agy (Antigravity's CLI, for the antigravity-native-ui agent) is a
    # compiled Go binary, NOT an npm package like claude/codex — installed
    # via Google's own script, landing in the same ~/.local/bin already on
    # PATH from the claude install above. Setting GEMINI_API_KEY alone does
    # nothing per Antigravity's own docs — it also needs
    # ~/.gemini/antigravity-cli/settings.json with modelProvider=gemini, or
    # the CLI ignores the key entirely. Whether install.sh self-detects
    # architecture (vs. needing the same uname -m treatment as Node) is
    # UNVERIFIED — first real run will confirm one way or the other.
    command: >
      sh -c "
      export PATH=\"$$HOME/.local/bin:$$PATH\" &&
      (command -v tmux >/dev/null && command -v git >/dev/null && command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl tmux git)) &&
      pip install --quiet --pre 'omnigent==0.8.2' &&
      pip install --quiet --upgrade 'websockets==14.2' &&
      (command -v claude >/dev/null || (mkdir -p \"$$HOME/.local\" && node_arch=$(uname -m | sed 's/aarch64/arm64/;s/x86_64/x64/') && curl -sSL \"https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-$$node_arch.tar.gz\" | tar -xz -C \"$$HOME/.local\" --strip-components=1 && npm install -g --quiet @anthropic-ai/claude-code)) &&
      (git config --global --add safe.directory '*' || true) &&
      touch /tmp/.holo-backend-ready &&
      alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      # The whole repo, not just ./test_backend — backend is the one
      # container an agent's shell runs in (HOLODECK_EXEC_SERVICE=backend,
      # set on the Omnigent side, not here), so it needs to reach
      # test_frontend/ source too when a ticket's target_repo isn't backend.
      - ./test_backend:/app
      - .:/workspace
    healthcheck:
      # Gated on the ready-sentinel, not just liveness — without this,
      # frontend's depends_on could observe backend as "healthy" (uvicorn
      # already answering) before the omnigent/claude install has actually
      # finished.
      test: ["CMD-SHELL", "test -f /tmp/.holo-backend-ready && python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s

  frontend:
    build:
      context: ./test_frontend
      target: build
    command: sh -c "npm run dev"
    environment:
      # Redirects vite.config.ts's proxy target from its host-oriented
      # default (localhost:18000) to the in-network service name — same
      # "STITCH" pattern control-tower's MAIN_API_URL override uses.
      VITE_API_PROXY_TARGET: "http://backend:8000"
    ports:
      - "${FRONTEND_PORT:-13000}:5173"
    volumes:
      - ./test_frontend:/app
      # Protects the image's already-`npm install`ed node_modules from being
      # shadowed by the host bind mount above — same reasoning as
      # control-tower's `/app/.venv` volume.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
