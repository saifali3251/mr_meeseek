# overrides/full-stack-application.pgdata.yaml
#
# Two jobs, same as control-tower.pgdata.yaml / compliance.pgdata.yaml:
#
#   1. Give db a bind-mounted data directory inside the checkout, so a
#      copy-on-write clone carries a warm, seeded DB. Post-split, the
#      composite override (full-stack-application.compose.yaml) declares
#      `db` with no volumes at all — there's no more named volume to
#      "relocate" from (that lived in the pre-split root compose.yaml,
#      which no longer exists), so this is now an addition, not a
#      relocation. `!override` is still correct/harmless here.
#   2. Pin backend/frontend's built image names so a unique
#      COMPOSE_PROJECT_NAME per workspace doesn't force a rebuild on every
#      strike — both declare `build:` with no `image:` in the composite
#      override, so Compose would otherwise derive
#      `<project>-backend`/`<project>-frontend` per workspace.
#
# `!override` REPLACES the service's volumes list instead of appending —
# needs Compose >= 2.24, same mechanism strike.sh's port stripping uses.

services:
  db:
    volumes: !override
      - ./docker/pgdata:/var/lib/postgresql/data

  backend:
    image: full-stack-application-backend:latest

  frontend:
    image: full-stack-application-frontend-dev:latest
