<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeseek Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Bangers&family=Luckiest+Guy&family=Patrick+Hand&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint (no flash). Default: light ("day").
      try { if (localStorage.getItem("meeseek-console-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen">
    <div class="mee-bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
